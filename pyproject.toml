[project]
name = "siakang-scrapling"
version = "0.2.0"
description = "Library for scraping Siakang Untirta (class schedules & semesters) over pure HTTP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.3",
    "scrapling[all]>=0.4.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["siakang"]

[dependency-groups]
dev = [
    "pytest>=8",
]
